# Synthetic example: the signal peeks one bar ahead. Expected: S1 PASS, S2 FAIL (lint BLOCK and truncation FAIL).
text: A signal built from the following bar predicts that bar (deliberately wrong, for the harness to catch).
strategy_family: trend
asset_class: synthetic
frequency: 1D
parameter_space_size: 2
thresholds:
  min_deflated_score: 0.5
  max_drawdown: 0.25
difference_statement: Look-ahead variant of the baseline trend rule.
adapter: "adapter:PeekingAdapter"
datasets: [prices]
windows:
  development: ["2020-04-01", "2021-06-30"]
bounds:
  max_abs_period_return: 0.5
  max_gross_leverage: 1.0
  max_position_weight: 1.0
# The independent P&L reconstruction (experimental) recomputes returns from the reported positions with this
# execution lag and compares them with what the adapter reported (see docs/methods.md).
execution:
  lag_bars: 1
  price_column: close
methods:
  s2.pnl_reconstruction: pnl_reconstruction@1
